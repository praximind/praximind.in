######################## default configuration ####################
baseURL = "https://praximind.in/"
title = "Praximind Labs — Intelligence. Engineered."
theme = "bigspring-light-hugo"

# Default time zone for time stamps
timeZone = "UTC"
# post pagination
pagination.pagerSize = 6
# post excerpt
summaryLength = 10
# disable German language — English only
disableLanguages = ["de"]

hasCJKLanguage = false

# robots.txt from layouts/robots.txt; no blog, so no taxonomy or feed pages
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

########################### Services #############################
[services]
[services.googleAnalytics]
ID = '' # Add Google Analytics ID when available

############################# Modules ############################
[module]
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/watching/hugo_stats.json"
disableWatch = true

############################# Build ##############################
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = '(js|scripts|javascript)'
[[build.cachebusters]]
source = 'assets/.*\.(css|sass|scss)$'
target = '(css|styles|scss|sass)'
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = '(css|styles|scss|sass)'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'

############################# Outputs ##############################
[outputs]
home = ["HTML"]

############################# Imaging ############################
[imaging]
resampleFilter = "Lanczos"
[imaging.jpeg]
quality = 90
[imaging.webp]
quality = 90

############################# Security ###########################
# Hugo 0.167+ blocks external tools unless listed; css.TailwindCSS runs the tailwindcss CLI
[security.exec]
allow = ["^(dart-)?sass(-embedded)?$", "^go$", "^git$", "^node$", "^npx$", "^postcss$", "^tailwindcss$"]

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai'

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true

############################# Plugins ##############################

# JS Plugins
[[params.plugins.js]]
link = "js/praximind.js"
